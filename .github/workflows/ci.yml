name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Build-only placeholders — no real secret is needed here since the
      # build never actually connects to Supabase/Gmail, it just needs
      # process.env.* to be non-empty wherever the app reads it eagerly.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          GMAIL_USER: ci-placeholder@example.com
          GMAIL_APP_PASSWORD: ci-placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          CRON_SECRET: ci-placeholder
